name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# En PRs cancela las ejecuciones obsoletas de la misma rama. En push nunca se
# cancela, para que una publicación en main no quede a medias.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # -------------------------------------------------------------------
  # Pruebas con H2 + cobertura JaCoCo (con umbral mínimo)
  # -------------------------------------------------------------------
  tests:
    name: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Dar permiso de ejecución al wrapper de Maven
        run: chmod +x mvnw

      - name: Compilar, probar y medir cobertura
        run: ./mvnw -B verify

      - name: Subir reporte de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

      - name: Subir reportes de pruebas (Surefire)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      # Lo que necesita el análisis de Sonar, para no repetir la compilación ni los tests.
      # Todas las rutas cuelgan de target/, así que el artefacto se guarda relativo a target/.
      - name: Subir insumos para Sonar
        uses: actions/upload-artifact@v7
        with:
          name: sonar-inputs
          path: |
            target/classes/
            target/test-classes/
            target/surefire-reports/
            target/site/jacoco/jacoco.xml
          retention-days: 1

  # -------------------------------------------------------------------
  # Análisis estático en SonarCloud (espera el quality gate)
  # El plan gratuito solo analiza main y los pull requests.
  # -------------------------------------------------------------------
  sonar:
    name: sonar
    needs: tests
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      # Vacío cuando el secreto no existe (por ejemplo, PRs desde forks).
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Sonar necesita el historial completo para blame y código nuevo.
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Descargar binarios y cobertura del job tests
        uses: actions/download-artifact@v8
        with:
          name: sonar-inputs
          path: target

      - name: Dar permiso de ejecución al wrapper de Maven
        run: chmod +x mvnw

      - name: Análisis en SonarCloud
        if: env.SONAR_TOKEN != ''
        run: >
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.9.0.7382:sonar
          -Dsonar.qualitygate.wait=true

  # -------------------------------------------------------------------
  # Valida en cada PR que la imagen Docker se construye (sin publicar)
  # -------------------------------------------------------------------
  docker-build:
    name: docker-build
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
