# Sistema completo: app + redis + prometheus + grafana.
# La base de datos NO va aquí: es PostgreSQL externo (Supabase) y se
# configura con DB_URL, DB_USERNAME y DB_PASSWORD en el .env.
# Uso: cp .env.example .env  (completar valores)  &&  docker compose up -d --build

services:
  app:
    build: .
    image: parcial-arquisoft:local
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  redis:
    image: redis:8-alpine
    # Caché pura: sin persistencia en disco (ni RDB ni AOF). Si Redis se
    # reinicia, la caché se vuelve a llenar desde la base de datos.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379" # solo para desarrollo
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.16.0
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - app
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Define GRAFANA_ADMIN_PASSWORD en el .env}
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  redis_data:
  prometheus_data:
  grafana_data:
