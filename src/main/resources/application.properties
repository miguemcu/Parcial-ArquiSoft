# =====================================================================
# Aplicación
# =====================================================================
spring.application.name=parcial_equipo_4

# Variables locales desde .env (ignorado por git). En Docker se usan
# variables de entorno reales y este archivo es opcional.
spring.config.import=optional:file:.env[.properties]

# =====================================================================
# Base de datos (PostgreSQL en Supabase vía Session pooler, IPv4)
# =====================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool pequeño: el pooler de Supabase limita las conexiones por cliente.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

# =====================================================================
# JPA / Hibernate (el esquema lo gestiona Flyway, nunca Hibernate)
# =====================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# =====================================================================
# Flyway
# =====================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# true solo en local si la base ya tenía tablas sin flyway_schema_history.
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}

# =====================================================================
# OpenAPI / Swagger
# =====================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5500}

# Versionamiento de la API por header (soporte nativo de Spring Framework 7)
spring.mvc.apiversion.use.header=X-API-Version
spring.mvc.apiversion.supported=1,2
spring.mvc.apiversion.detect-supported=false
# El header es obligatorio solo en /api/** (ver ApiVersionConfig); "required" es global y bloquearía Swagger
spring.mvc.apiversion.required=false

# =====================================================================
# Redis / caché
# =====================================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=200ms
spring.cache.type=redis
spring.cache.redis.time-to-live=10m
spring.cache.redis.enable-statistics=true
spring.cache.redis.cache-null-values=false
