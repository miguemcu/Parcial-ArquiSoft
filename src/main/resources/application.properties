spring.application.name=parcial_equipo_4
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Versionamiento de la API por header (soporte nativo de Spring Framework 7)
spring.mvc.apiversion.use.header=X-API-Version
spring.mvc.apiversion.supported=1,2
spring.mvc.apiversion.detect-supported=false
# El header es obligatorio solo en /api/** (ver ApiVersionConfig); "required" es global y bloquearía Swagger
spring.mvc.apiversion.required=false
