# Configuración autocontenida para pruebas.
# Al estar en test-classes, este archivo reemplaza al application.properties
# principal durante los tests: no se usan DB_URL, DB_USERNAME ni DB_PASSWORD,
# ni se lee el .env. No necesita Postgres, Redis ni Docker.
spring.application.name=parcial_equipo_4

# H2 en memoria emulando PostgreSQL
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# El esquema lo crean las migraciones reales de Flyway; Hibernate solo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis no está disponible en las pruebas: que el health check no lo consulte.
management.health.redis.enabled=false
