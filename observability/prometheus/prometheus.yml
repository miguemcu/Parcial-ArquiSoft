global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Servidor Spring Boot ejecutándose localmente en el host
  - job_name: 'spring-boot-local'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          namespace: 'local'

  # Servidor Spring Boot ejecutándose en contenedor Docker (nombre del servicio: app)
  - job_name: 'spring-boot-docker'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['app:8080']
        labels:
          namespace: 'docker'

  # Servidor Spring Boot desplegado en Render (HTTPS)
  # Reemplaza el host con el dominio real de tu servicio en Render
  - job_name: 'spring-boot-render'
    metrics_path: '/actuator/prometheus'
    scheme: https
    scrape_interval: 30s
    static_configs:
      - targets: ['parcial-arquisoft.onrender.com']
        labels:
          namespace: 'render'
